<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="icon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>CalcNPlay</title>
  <link rel="stylesheet" href="../shared/styles.css">
  <link rel="stylesheet" href="game.css">
</head>
<body>
<div id="game-layout" class="cnp-layout">

  <!-- Fond d'écran -->
  <div id="bg-layer" class="cnp-bg-layer"></div>

  <!-- Pièces du puzzle (par-dessus le fond) -->
  <div id="puzzle-layer" class="cnp-puzzle-layer"></div>

  <!-- Zone de chute des questions -->
  <div id="question-layer" class="cnp-question-layer"></div>

  <!-- Header semi-transparent -->
  <header id="game-header" class="cnp-header">
    <button id="exit-btn" class="cnp-exit-btn" title="Quitter">✕</button>
    <div id="answer-display" class="cnp-answer-display"></div>
    <div class="cnp-header-right">
      <span id="score-val" class="cnp-score">0</span>
      <div id="lives-display" class="cnp-lives"></div>
    </div>
  </header>

  <!-- Spacer (pousse le footer en bas) -->
  <div class="cnp-spacer"></div>

  <!-- Numpad footer -->
  <footer id="numpad" class="cnp-numpad"></footer>

</div>

<button id="fullscreen-btn" class="fullscreen-btn" title="Plein écran">
  <svg id="fs-expand" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
  <svg id="fs-compress" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><polyline points="4 14 10 14 10 20"/><polyline points="20 10 14 10 14 4"/><line x1="10" y1="14" x2="3" y2="21"/><line x1="21" y1="3" x2="14" y2="10"/></svg>
</button>

<!-- Écran de résultat -->
<div id="result-overlay" class="end-screen" style="display:none">
  <div class="end-emoji" id="result-emoji">🎉</div>
  <div class="end-title" id="result-title">Partie terminée</div>
  <div class="end-stars" id="result-stars"></div>
  <div class="end-score" id="result-score"></div>
  <div style="display:flex;gap:12px;margin-top:16px">
    <button id="result-replay" class="btn btn-primary">↺ Rejouer</button>
    <a href="index.html" class="btn btn-secondary">← Retour</a>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="game-config.js"></script>
<script src="../shared/firebase-core.js"></script>
<script src="../shared/platform-methods.js"></script>
<script src="firebase-service.js"></script>
<script src="game.js"></script>
</body>
</html>
